name: Pre-commit CI
on:
  pull_request_target:

jobs:
  pre-commit:
    # pull_request_target runs with a write token: never check out fork code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      # The typecheck and test hooks (language: system) need the project's dependencies.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: |
          pre-commit install
          pre-commit run --all-files

      - uses: stefanzweifel/git-auto-commit-action@v7
        if: always()
        with:
          commit_message: "fix: Automated Changes by Pre-commit"
